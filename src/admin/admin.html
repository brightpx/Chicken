<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ผู้ดูแลร้านไก่</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #fffaf2; color: #333; }
      .shell { max-width: 1400px; margin: 0 auto; padding: 24px; }
      .card { background: white; border-radius: 16px; padding: 1rem 1.25rem; margin-bottom: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border: 1px solid #f3e2c8; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
      .metric { font-size: 1.4rem; font-weight: bold; color: #d9534f; }
      form { display: grid; gap: 0.8rem; }
      .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.8rem; }
      label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.95rem; }
      input, select, button { padding: 0.7rem; border-radius: 8px; border: 1px solid #e0d1b7; font-size: 0.95rem; }
      button { background: #d9534f; color: white; cursor: pointer; border: none; }
      button.secondary { background: #f5b041; }
      .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #fce8d4; color: #8a4d12; font-size: 0.8rem; }
      .list { display: grid; gap: 0.5rem; }
      .item { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 0.8rem; border: 1px solid #f0e0ce; border-radius: 10px; background: #fffdfa; }
      .status { margin-top: 0.5rem; color: #0a7f3e; font-weight: 600; }
      .error { color: #c0392b; }
      pre { background: #fcfaf6; padding: 1rem; border-radius: 10px; overflow: auto; border: 1px solid #f0e0ce; }
      .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; min-width: 1100px; border-collapse: collapse; font-size: 0.95rem; }
      th, td { padding: 0.75rem 0.6rem; border-bottom: 1px solid #f0e0ce; text-align: left; vertical-align: top; }
      th { background: #fff5e8; color: #8a4d12; font-weight: 700; }
      tbody tr:hover { background: #fffdfa; }
      .empty { color: #8a4d12; padding: 0.8rem 0; }
    </style>
  </head>
  <body>
    <div class="shell">
      <h1>แดชบอร์ดผู้ดูแลร้านไก่</h1>
      <div class="grid">
        <div class="card"><strong>ลูกค้า</strong><div class="metric" id="customers">-</div></div>
        <div class="card"><strong>ประเภทไก่</strong><div class="metric" id="chickenTypes">-</div></div>
        <div class="card"><strong>คำสั่งซื้อ</strong><div class="metric" id="orders">-</div></div>
        <div class="card"><strong>รายได้ (จ่ายแล้ว)</strong><div class="metric" id="revenue">-</div></div>
      </div>

      <div class="card">
        <h3>คำสั่งซื้อล่าสุด (20 รายการ)</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>คำสั่งซื้อ</th>
                <th>ลูกค้า</th>
                <th>วิธีจัดส่ง</th>
                <th>สถานะชำระ</th>
                <th>สถานะจัดส่ง</th>
                <th>รวมเงิน</th>
                <th>การดำเนินการ</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr><td colspan="7" class="empty">กำลังโหลด...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h3>เพิ่มคำสั่งซื้อใหม่</h3>
        <form id="orderForm">
          <div class="row">
            <label>ชื่อลูกค้า<input name="customerName" /></label>
            <label>เบอร์โทร<input name="phone" /></label>
            <label>ที่อยู่<input name="address" /></label>
          </div>
          <div class="row">
            <label>วิธีจัดส่ง
              <select name="deliveryMethod">
                <option value="pickup">รับที่ร้าน</option>
                <option value="home">จัดส่งบ้าน</option>
              </select>
            </label>
            <label>สถานที่จัดส่ง<input name="deliveryLocation" /></label>
            <label>สถานะชำระ
              <select name="paymentStatus">
                <option value="pending">รอดำเนินการ</option>
                <option value="paid">ชำระแล้ว</option>
                <option value="partial">บางส่วน</option>
              </select>
            </label>
          </div>
          <div class="row">
            <label>สถานะจัดส่ง
              <select name="deliveryStatus">
                <option value="pending">รอดำเนินการ</option>
                <option value="delivered">จัดส่งแล้ว</option>
                <option value="cancelled">ยกเลิก</option>
              </select>
            </label>
          </div>
          <div id="itemsContainer"></div>
          <div style="margin-top: 0.5rem; font-weight: 700; color: #8a4d12;" id="orderTotalSummary">ราคารวมทั้งออเดอร์: 0 บาท</div>
          <div class="actions">
            <button type="button" class="secondary" id="addItemBtn">เพิ่มรายการไก่</button>
            <button type="submit" id="orderSubmitBtn">บันทึกคำสั่งซื้อ</button>
            <button type="button" class="secondary" id="cancelOrderEditBtn" style="display:none;">ยกเลิก</button>
          </div>
        </form>
        <div class="status" id="orderStatus"></div>
      </div>

      <div class="card">
        <h3>เพิ่มประเภทไก่และราคา</h3>
        <form id="chickenForm">
          <div class="row">
            <label>ชื่อประเภทไก่<input name="name" required /></label>
            <label>น้ำหนัก/กิโลกรัม<input name="unitWeightKg" type="number" step="0.1" required /></label>
            <label>ราคา (บาท)<input name="price" type="number" step="0.01" required /></label>
          </div>
          <div class="actions">
            <button type="submit" id="chickenSubmitBtn">บันทึกประเภทไก่</button>
            <button type="button" class="secondary" id="cancelEditBtn" style="display:none;">ยกเลิก</button>
          </div>
        </form>
        <div class="status" id="chickenStatus"></div>
      </div>

      <div class="card">
        <h3>ประเภทไก่ที่มีอยู่</h3>
        <div class="list" id="chickenList"></div>
      </div>

    </div>

    <script>
      const chickenForm = document.getElementById('chickenForm');
      const orderForm = document.getElementById('orderForm');
      const chickenStatus = document.getElementById('chickenStatus');
      const orderStatus = document.getElementById('orderStatus');
      const chickenList = document.getElementById('chickenList');
      const itemsContainer = document.getElementById('itemsContainer');
      const addItemBtn = document.getElementById('addItemBtn');
      const orderSubmitBtn = document.getElementById('orderSubmitBtn');
      const cancelOrderEditBtn = document.getElementById('cancelOrderEditBtn');
      let chickenTypes = [];
      let defaultCookingPrice = 30;
      let editingChickenTypeId = null;
      let editingOrderId = null;
      let dashboardOrders = [];

      function applyDefaultCookingPrice() {
        const input = orderForm.querySelector('input[name="cookingPrice"]');
        const preparationTypeSelect = orderForm.querySelector('select[name="preparationType"]');
        if (input && preparationTypeSelect) {
          const isBoiled = preparationTypeSelect.value === 'boiled';
          input.value = isBoiled ? (defaultCookingPrice || 30) : 0;
        }
      }

      function setStatus(element, message, isError = false) {
        element.textContent = message;
        element.className = isError ? 'status error' : 'status';
      }

      function resetOrderForm() {
        orderForm.reset();
        editingOrderId = null;
        orderSubmitBtn.textContent = 'บันทึกคำสั่งซื้อ';
        cancelOrderEditBtn.style.display = 'none';
        setStatus(orderStatus, '');
        itemsContainer.innerHTML = '';
        addItemRow();
        updateOrderTotalSummary();
      }

      function editOrder(id) {
        const order = dashboardOrders.find((entry) => entry.id === id);
        if (!order) {
          return;
        }

        const customer = order.customer || {};
        const customerNameInput = orderForm.querySelector('input[name="customerName"]');
        const phoneInput = orderForm.querySelector('input[name="phone"]');
        const addressInput = orderForm.querySelector('input[name="address"]');
        const deliveryMethodSelect = orderForm.querySelector('select[name="deliveryMethod"]');
        const deliveryLocationInput = orderForm.querySelector('input[name="deliveryLocation"]');
        const paymentStatusSelect = orderForm.querySelector('select[name="paymentStatus"]');
        const deliveryStatusSelect = orderForm.querySelector('select[name="deliveryStatus"]');

        if (customerNameInput) customerNameInput.value = customer.name || order.customerName || '';
        if (phoneInput) phoneInput.value = customer.phone || '';
        if (addressInput) addressInput.value = customer.address || '';
        if (deliveryMethodSelect) deliveryMethodSelect.value = order.deliveryMethod || 'pickup';
        if (deliveryLocationInput) deliveryLocationInput.value = order.deliveryLocation || '';
        if (paymentStatusSelect) paymentStatusSelect.value = order.paymentStatus || 'pending';
        if (deliveryStatusSelect) deliveryStatusSelect.value = order.deliveryStatus || 'pending';

        itemsContainer.innerHTML = '';
        const items = Array.isArray(order.items) ? order.items : [];
        if (!items.length) {
          addItemRow();
        } else {
          items.forEach((item) => {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `
              <label>ประเภทไก่
                <select name="chickenTypeId" required>
                  ${chickenTypes.map((entry) => `<option value="${entry.id}" ${entry.id === item.chickenTypeId ? 'selected' : ''}>${entry.name} · ${entry.averagePrice.toLocaleString()} บาท</option>`).join('')}
                </select>
              </label>
              <label>จำนวน<input name="quantity" type="number" min="1" value="${item.quantity ?? 1}" required /></label>
              <label>รูปแบบการเตรียม
                <select name="preparationType">
                  <option value="fresh" ${item.preparationType === 'fresh' ? 'selected' : ''}>สด</option>
                  <option value="boiled" ${item.preparationType === 'boiled' ? 'selected' : ''}>ต้ม</option>
                </select>
              </label>
              <label>ค่าเพิ่มการต้ม (บาท)<input name="cookingPrice" type="number" step="0.01" value="${item.cookingPrice ?? 0}" /></label>
              <label>ลบรายการ<button type="button" class="secondary" onclick="this.parentElement.parentElement.remove()">ลบ</button></label>
              <div class="item-summary" style="grid-column: 1 / -1; color: #8a4d12; font-size: 0.9rem;">กำลังคำนวณ...</div>
            `;
            itemsContainer.appendChild(row);
            bindItemRowEvents(row);
            updateItemRowSummary(row);
          });
        }

        editingOrderId = id;
        orderSubmitBtn.textContent = 'อัปเดตคำสั่งซื้อ';
        cancelOrderEditBtn.style.display = 'inline-block';
        setStatus(orderStatus, 'กำลังแก้ไขคำสั่งซื้อ');
        orderForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      async function markOrderPaid(id) {
        setStatus(orderStatus, 'กำลังอัปเดตสถานะชำระ...');
        const res = await fetch(`/orders/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentStatus: 'paid' }),
        });

        if (!res.ok) {
          const errorText = await res.text();
          setStatus(orderStatus, 'อัปเดตไม่สำเร็จ: ' + errorText, true);
          return;
        }

        setStatus(orderStatus, 'อัปเดตสถานะชำระเรียบร้อย');
        await loadDashboard();
      }

      window.editOrder = editOrder;
      window.markOrderPaid = markOrderPaid;

      function renderChickenTypes() {
        if (!chickenTypes.length) {
          chickenList.innerHTML = '<div class="item"><span>ยังไม่มีประเภทไก่</span></div>';
          return;
        }

        chickenList.innerHTML = chickenTypes.map((item) => `
          <div class="item">
            <div>
              <strong>${item.name || '-'}</strong><br/>
              <small>น้ำหนัก ${Number(item.unitWeightKg ?? 0).toLocaleString()} กก · ราคา ${Number(item.averagePrice ?? 0).toLocaleString()} บาท</small>
            </div>
            <div class="actions">
              <button type="button" class="secondary" onclick="editChickenType('${item.id}')">แก้ไข</button>
            </div>
          </div>
        `).join('');
      }

      function resetChickenForm() {
        chickenForm.reset();
        editingChickenTypeId = null;
        document.getElementById('chickenSubmitBtn').textContent = 'บันทึกประเภทไก่';
        document.getElementById('cancelEditBtn').style.display = 'none';
      }

      function editChickenType(id) {
        const item = chickenTypes.find((entry) => entry.id === id);
        if (!item) {
          return;
        }

        editingChickenTypeId = id;
        const nameInput = chickenForm.querySelector('input[name="name"]');
        const unitWeightInput = chickenForm.querySelector('input[name="unitWeightKg"]');
        const priceInput = chickenForm.querySelector('input[name="price"]');
        if (nameInput) nameInput.value = item.name;
        if (unitWeightInput) unitWeightInput.value = item.unitWeightKg;
        if (priceInput) priceInput.value = item.averagePrice;

        document.getElementById('chickenSubmitBtn').textContent = 'อัปเดตประเภทไก่';
        document.getElementById('cancelEditBtn').style.display = 'inline-block';
        chickenStatus.textContent = '';
        chickenStatus.className = 'status';
      }

      window.editChickenType = editChickenType;

      function applyCookingPriceForSelection(row) {
        const preparationSelect = row.querySelector('select[name="preparationType"]');
        const cookingPriceInput = row.querySelector('input[name="cookingPrice"]');
        if (!preparationSelect || !cookingPriceInput) {
          return;
        }

        const isBoiled = preparationSelect.value === 'boiled';
        cookingPriceInput.value = isBoiled ? String(defaultCookingPrice || 30) : '0';
        updateItemRowSummary(row);
      }

      function updateOrderTotalSummary() {
        const rows = itemsContainer.querySelectorAll('.row');
        const total = Array.from(rows).reduce((sum, row) => {
          const select = row.querySelector('select[name="chickenTypeId"]');
          const quantityInput = row.querySelector('input[name="quantity"]');
          const preparationSelect = row.querySelector('select[name="preparationType"]');
          const cookingPriceInput = row.querySelector('input[name="cookingPrice"]');
          const selectedType = chickenTypes.find((item) => item.id === select?.value);
          const basePrice = Number(selectedType?.averagePrice ?? 0);
          const isBoiled = preparationSelect?.value === 'boiled';
          const cookingPrice = Number(cookingPriceInput?.value || 0);
          const unitPrice = basePrice + (isBoiled ? cookingPrice : 0);
          const quantity = Number(quantityInput?.value || 0);
          return sum + unitPrice * quantity;
        }, 0);

        const totalElement = document.getElementById('orderTotalSummary');
        if (totalElement) {
          totalElement.textContent = `ราคารวมทั้งออเดอร์: ${total.toLocaleString()} บาท`;
        }
      }

      function updateItemRowSummary(row) {
        const select = row.querySelector('select[name="chickenTypeId"]');
        const preparationSelect = row.querySelector('select[name="preparationType"]');
        const cookingPriceInput = row.querySelector('input[name="cookingPrice"]');
        const quantityInput = row.querySelector('input[name="quantity"]');
        const summary = row.querySelector('.item-summary');
        const selectedType = chickenTypes.find((item) => item.id === select?.value);
        const basePrice = Number(selectedType?.averagePrice ?? 0);
        const isBoiled = preparationSelect?.value === 'boiled';
        const cookingPrice = Number(cookingPriceInput?.value || 0);
        const quantity = Number(quantityInput?.value || 0);
        const unitPrice = basePrice + (isBoiled ? cookingPrice : 0);
        const totalPrice = unitPrice * quantity;
        if (summary) {
          summary.textContent = isBoiled
            ? `ราคา ${totalPrice.toLocaleString()} บาท (${quantity} x ${unitPrice.toLocaleString()} บาท รวมค่าต้ม)`
            : `ราคา ${totalPrice.toLocaleString()} บาท (${quantity} x ${unitPrice.toLocaleString()} บาท)`;
        }
        updateOrderTotalSummary();
      }

      function bindItemRowEvents(row) {
        row.querySelector('select[name="chickenTypeId"]')?.addEventListener('change', () => updateItemRowSummary(row));
        row.querySelector('select[name="preparationType"]')?.addEventListener('change', () => applyCookingPriceForSelection(row));
        row.querySelector('input[name="cookingPrice"]')?.addEventListener('input', () => updateItemRowSummary(row));
        row.querySelector('input[name="quantity"]')?.addEventListener('input', () => updateItemRowSummary(row));
      }

      function addItemRow() {
        const wrapper = document.createElement('div');
        wrapper.className = 'row';
        wrapper.innerHTML = `
          <label>ประเภทไก่
            <select name="chickenTypeId" required>
              ${chickenTypes.map((item) => `<option value="${item.id}">${item.name} · ${item.averagePrice.toLocaleString()} บาท</option>`).join('')}
            </select>
          </label>
          <label>จำนวน<input name="quantity" type="number" min="1" value="1" required /></label>
          <label>รูปแบบการเตรียม
            <select name="preparationType">
              <option value="fresh">สด</option>
              <option value="boiled">ต้ม</option>
            </select>
          </label>
          <label>ค่าเพิ่มการต้ม (บาท)<input name="cookingPrice" type="number" step="0.01" value="0" /></label>
          <label>ลบรายการ<button type="button" class="secondary" onclick="this.parentElement.parentElement.remove()">ลบ</button></label>
          <div class="item-summary" style="grid-column: 1 / -1; color: #8a4d12; font-size: 0.9rem;">กำลังคำนวณ...</div>
        `;
        itemsContainer.appendChild(wrapper);
        bindItemRowEvents(wrapper);
        applyCookingPriceForSelection(wrapper);
      }

      function refreshItemRowOptions() {
        const rows = itemsContainer.querySelectorAll('.row');
        rows.forEach((row) => {
          const select = row.querySelector('select[name="chickenTypeId"]');
          if (!select) {
            return;
          }

          select.innerHTML = chickenTypes.length
            ? chickenTypes.map((item) => `<option value="${item.id}">${item.name} · ${item.averagePrice.toLocaleString()} บาท</option>`).join('')
            : '<option value="">ยังไม่มีประเภทไก่</option>';
          updateItemRowSummary(row);
        });
      }

      async function loadDashboard() {
        const res = await fetch('/admin/dashboard?ts=' + Date.now());
        const data = await res.json();

        document.getElementById('customers').textContent = data.totalCustomers;
        document.getElementById('chickenTypes').textContent = data.totalChickenTypes;
        document.getElementById('orders').textContent = data.totalOrders;
        document.getElementById('revenue').textContent = data.totalRevenue.toLocaleString();

        const tableBody = document.getElementById('ordersTableBody');
        dashboardOrders = Array.isArray(data.orders) ? data.orders.slice(0, 20) : [];
        if (!dashboardOrders.length) {
          tableBody.innerHTML = '<tr><td colspan="7" class="empty">ยังไม่มีคำสั่งซื้อ</td></tr>';
          return;
        }

        tableBody.innerHTML = dashboardOrders.map((order) => {
          const customer = order.customer || {};
          const items = Array.isArray(order.items) ? order.items : [];
          const itemsText = items
            .map((item) => {
              const matchedType = chickenTypes.find((type) => type.id === item.chickenTypeId);
              const name = item.chickenTypeName || matchedType?.name || 'ไก่';
              return `${item.quantity ?? 0} x ${name}`;
            })
            .join(', ');
          return `
            <tr>
              <td><strong>${order.id ?? '-'}</strong><br/><small>${itemsText || '-'}</small></td>
              <td>${customer.name ?? '-'}</td>
              <td>${order.deliveryMethod === 'home' ? 'จัดส่งบ้าน' : 'รับที่ร้าน'}</td>
              <td>${order.paymentStatus === 'paid' ? 'ชำระแล้ว' : order.paymentStatus === 'partial' ? 'บางส่วน' : 'รอดำเนินการ'}</td>
              <td>${order.deliveryStatus === 'delivered' ? 'จัดส่งแล้ว' : order.deliveryStatus === 'cancelled' ? 'ยกเลิก' : 'รอดำเนินการ'}</td>
              <td>${Number(order.totalAmount ?? 0).toLocaleString()} บาท</td>
              <td>
                <div class="actions">
                  <button type="button" class="secondary" onclick="editOrder('${order.id}')">แก้ไข</button>
                  <button type="button" onclick="markOrderPaid('${order.id}')">ชำระแล้ว</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');

        defaultCookingPrice = Number(data.defaultCookingPrice ?? 30);
        applyDefaultCookingPrice();
      }

      async function loadChickenTypes() {
        const res = await fetch('/chicken-types');
        chickenTypes = await res.json();
        renderChickenTypes();
        if (!itemsContainer.querySelector('select')) {
          addItemRow();
        } else {
          refreshItemRowOptions();
        }
      }

      document.getElementById('cancelEditBtn').addEventListener('click', resetChickenForm);

      chickenForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(chickenForm);
        const payload = {
          name: formData.get('name'),
          unitWeightKg: Number(formData.get('unitWeightKg')),
          pricePerKg: Number(formData.get('price')),
          averagePrice: Number(formData.get('price')),
        };

        setStatus(chickenStatus, editingChickenTypeId ? 'กำลังอัปเดต...' : 'กำลังบันทึก...');
        const url = editingChickenTypeId ? `/chicken-types/${editingChickenTypeId}` : '/chicken-types';
        const method = editingChickenTypeId ? 'PATCH' : 'POST';
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const errorText = await res.text();
          setStatus(chickenStatus, editingChickenTypeId ? 'อัปเดตไม่สำเร็จ: ' + errorText : 'บันทึกไม่สำเร็จ: ' + errorText, true);
          return;
        }

        resetChickenForm();
        setStatus(chickenStatus, editingChickenTypeId ? 'อัปเดตประเภทไก่เรียบร้อย' : 'บันทึกประเภทไก่เรียบร้อย');
        await loadChickenTypes();
        await loadDashboard();
      });

      orderForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(orderForm);

        if (editingOrderId) {
          setStatus(orderStatus, 'กำลังอัปเดตคำสั่งซื้อ...');
          const items = Array.from(itemsContainer.querySelectorAll('.row')).map((row) => {
            const select = row.querySelector('select[name="chickenTypeId"]');
            const quantityInput = row.querySelector('input[name="quantity"]');
            const preparationSelect = row.querySelector('select[name="preparationType"]');
            const cookingPriceInput = row.querySelector('input[name="cookingPrice"]');
            const selectedType = chickenTypes.find((entry) => entry.id === select?.value);
            const basePrice = Number(selectedType?.averagePrice ?? 0);
            const isBoiled = preparationSelect?.value === 'boiled';
            const cookingPrice = Number(cookingPriceInput?.value || 0);
            const unitPrice = basePrice + (isBoiled ? cookingPrice : 0);
            const quantity = Number(quantityInput?.value || 0);
            return {
              chickenTypeId: select?.value,
              quantity,
              preparationType: isBoiled ? 'boiled' : 'fresh',
              cookingPrice,
              unitPrice,
              totalPrice: unitPrice * quantity,
            };
          });
          const totalAmount = items.reduce((sum, item) => sum + item.totalPrice, 0);
          const updatePayload = {
            deliveryMethod: formData.get('deliveryMethod'),
            deliveryLocation: formData.get('deliveryLocation'),
            paymentStatus: formData.get('paymentStatus'),
            deliveryStatus: formData.get('deliveryStatus'),
            items,
            totalAmount,
          };

          const res = await fetch(`/orders/${editingOrderId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatePayload),
          });

          if (!res.ok) {
            const errorText = await res.text();
            setStatus(orderStatus, 'อัปเดตคำสั่งซื้อไม่สำเร็จ: ' + errorText, true);
            return;
          }

          resetOrderForm();
          setStatus(orderStatus, 'อัปเดตคำสั่งซื้อเรียบร้อย');
          await loadDashboard();
          return;
        }

        const customerPayload = {
          name: formData.get('customerName'),
          phone: formData.get('phone'),
          address: formData.get('address'),
          deliveryMethod: formData.get('deliveryMethod'),
        };

        const items = Array.from(itemsContainer.querySelectorAll('.row')).map((row) => {
          const select = row.querySelector('select[name="chickenTypeId"]');
          const quantityInput = row.querySelector('input[name="quantity"]');
          const preparationSelect = row.querySelector('select[name="preparationType"]');
          const cookingPriceInput = row.querySelector('input[name="cookingPrice"]');
          return {
            chickenTypeId: select.value,
            quantity: Number(quantityInput.value),
            preparationType: preparationSelect?.value === 'boiled' ? 'boiled' : 'fresh',
            cookingPrice: Number(cookingPriceInput?.value || 0),
          };
        });

        if (!items.length || items.some((item) => !item.chickenTypeId || item.quantity <= 0)) {
          setStatus(orderStatus, 'กรุณาเลือกรายการไก่ให้ครบถ้วน', true);
          return;
        }

        setStatus(orderStatus, 'กำลังสร้างคำสั่งซื้อ...');
        const customerRes = await fetch('/customers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(customerPayload),
        });

        if (!customerRes.ok) {
          const errorText = await customerRes.text();
          setStatus(orderStatus, 'สร้างลูกค้าไม่สำเร็จ: ' + errorText, true);
          return;
        }

        const customer = await customerRes.json();
        const orderPayload = {
          customerId: customer.id,
          deliveryMethod: formData.get('deliveryMethod'),
          deliveryLocation: formData.get('deliveryLocation'),
          paymentStatus: formData.get('paymentStatus'),
          deliveryStatus: formData.get('deliveryStatus'),
          items,
        };

        const orderRes = await fetch('/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderPayload),
        });

        if (!orderRes.ok) {
          const errorText = await orderRes.text();
          setStatus(orderStatus, 'สร้างคำสั่งซื้อไม่สำเร็จ: ' + errorText, true);
          return;
        }

        const createdOrder = await orderRes.json();
        resetOrderForm();
        setStatus(orderStatus, `สร้างคำสั่งซื้อเรียบร้อย (Order ID: ${createdOrder.id || '-'})`);
        await loadChickenTypes();
        await loadDashboard();
      });

      cancelOrderEditBtn.addEventListener('click', resetOrderForm);
      addItemBtn.addEventListener('click', addItemRow);
      addItemRow();
      loadChickenTypes().catch(() => {
        setStatus(chickenStatus, 'โหลดประเภทไก่ไม่สำเร็จ', true);
      });
      loadDashboard().catch(() => {
        const tableBody = document.getElementById('ordersTableBody');
        if (tableBody) {
          tableBody.innerHTML = '<tr><td colspan="7" class="empty">โหลดข้อมูลไม่สำเร็จ</td></tr>';
        }
        setStatus(orderStatus, 'โหลดข้อมูลแดชบอร์ดไม่สำเร็จ', true);
      });
    </script>
  </body>
</html>
