<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicken Shop Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #fffaf3;
        --card: #ffffff;
        --text: #2f2a24;
        --muted: #6f655d;
        --accent: #ef6f3c;
        --accent-2: #f5b041;
        --border: #f0e0ce;
      }
      * { box-sizing: border-box; }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes heroGlow {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }

      @keyframes pulseDot {
        0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.65); }
        70% { box-shadow: 0 0 0 8px rgba(255, 255, 255, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
      }

      @keyframes valueFlash {
        0% { color: var(--accent); transform: scale(1.08); }
        100% { color: var(--text); transform: scale(1); }
      }

      @keyframes softPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      body {
        margin: 0;
        font-family: 'Prompt', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #fffaf3 0%, #fff2e3 100%);
        color: var(--text);
      }

      .shell { max-width: 1200px; margin: 0 auto; padding: 24px; animation: fadeIn 0.5s ease both; }

      .hero {
        display: flex; justify-content: space-between; align-items: center; gap: 16px;
        background: linear-gradient(120deg, var(--accent), var(--accent-2), var(--accent));
        background-size: 200% 200%;
        animation: heroGlow 8s ease infinite, fadeInUp 0.5s ease both;
        color: white; border-radius: 24px; padding: 24px; box-shadow: 0 18px 40px rgba(239,111,60,0.25);
        transition: box-shadow 0.3s ease;
      }
      .hero:hover { box-shadow: 0 22px 48px rgba(239,111,60,0.32); }
      .hero h1 { margin: 0 0 8px; font-size: 2rem; font-weight: 700; }
      .hero p { margin: 0; opacity: 0.95; }

      .live-dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #ffffff;
        margin-right: 6px;
        animation: pulseDot 1.8s ease-out infinite;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px; padding: 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.04);
        animation: fadeInUp 0.45s ease both;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 36px rgba(239,111,60,0.14);
      }

      .grid .card:nth-child(1) { animation-delay: 0.02s; }
      .grid .card:nth-child(2) { animation-delay: 0.08s; }
      .grid .card:nth-child(3) { animation-delay: 0.14s; }
      .grid .card:nth-child(4) { animation-delay: 0.2s; }

      .card h3 { margin: 0 0 8px; font-size: 0.95rem; color: var(--muted); }
      .value { font-size: 1.7rem; font-weight: 700; transition: transform 0.2s ease; }
      .value.flash { animation: valueFlash 0.6s ease; }

      .chart-card { margin-top: 20px; }
      .chart-wrap { position: relative; height: 240px; }
      canvas { width: 100% !important; height: 100% !important; }

      .table-card { margin-top: 20px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
      th { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }

      tbody tr {
        animation: fadeInUp 0.35s ease both;
        transition: background 0.2s ease;
      }
      tbody tr:hover { background: #fff6e6; }

      .status {
        display:inline-block; padding:4px 8px; border-radius:999px; font-size:0.8rem; font-weight:600;
        transition: transform 0.15s ease;
      }
      .status:hover { transform: scale(1.05); }
      .paid { background:#eaf8ef; color:#2e7d32; }
      .pending { background:#fff4e5; color:#b36b00; }
      .muted { color: var(--muted); }
      .loading { color: var(--muted); animation: softPulse 1.4s ease-in-out infinite; }

      ::-webkit-scrollbar { height: 10px; width: 10px; }
      ::-webkit-scrollbar-track { background: #fdf1de; border-radius: 999px; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--accent-2), var(--accent)); border-radius: 999px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hero">
        <div>
          <h1>Chicken Shop Dashboard</h1>
          <p>ภาพรวมยอดขาย ลูกค้า และคำสั่งซื้อแบบทันที</p>
        </div>
        <div class="muted" id="updatedAt"><span class="live-dot"></span>กำลังเชื่อมต่อ…</div>
      </div>

      <div class="grid">
        <div class="card"><h3>ลูกค้า</h3><div class="value" id="customers">-</div></div>
        <div class="card"><h3>ประเภทไก่</h3><div class="value" id="chickenTypes">-</div></div>
        <div class="card"><h3>คำสั่งซื้อ</h3><div class="value" id="orders">-</div></div>
        <div class="card"><h3>รายได้</h3><div class="value" id="revenue">-</div></div>
      </div>

      <div class="card chart-card">
        <h3>ภาพรวมคำสั่งซื้อ</h3>
        <div class="chart-wrap"><canvas id="ordersChart"></canvas></div>
      </div>

      <div class="card table-card">
        <h3>คำสั่งซื้อล่าสุด</h3>
        <div id="ordersTable" class="loading">กำลังโหลดข้อมูล...</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      let chartInstance = null;

      function flashValue(elementId, newValue) {
        const element = document.getElementById(elementId);
        if (!element) {
          return;
        }

        const changed = element.textContent !== String(newValue);
        element.textContent = newValue;
        if (changed) {
          element.classList.remove('flash');
          void element.offsetWidth;
          element.classList.add('flash');
        }
      }

      function renderChart(orders) {
        const labels = orders.slice(-5).map((order, index) => `Order ${index + 1}`);
        const values = orders.slice(-5).map((order) => order.totalAmount);
        const ctx = document.getElementById('ordersChart').getContext('2d');

        if (chartInstance) {
          chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: 'ยอดขาย',
              data: values,
              backgroundColor: ['#ef6f3c', '#f5b041', '#f39c12', '#e67e22', '#d35400'],
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } }
          }
        });
      }

      async function loadDashboard() {
        const res = await fetch(`/admin/dashboard?ts=${Date.now()}`);
        const data = await res.json();

        flashValue('customers', data.totalCustomers);
        flashValue('chickenTypes', data.totalChickenTypes);
        flashValue('orders', data.totalOrders);
        flashValue('revenue', `${data.totalRevenue.toLocaleString()} ฿`);
        document.getElementById('updatedAt').innerHTML = `<span class="live-dot"></span>อัปเดต ${new Date().toLocaleTimeString('th-TH')}`;

        renderChart(data.orders);

        const table = document.getElementById('ordersTable');
        if (!data.orders.length) {
          table.innerHTML = '<p class="loading">ยังไม่มีคำสั่งซื้อ</p>';
          return;
        }

        table.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>ลูกค้า</th>
                <th>ยอดรวม</th>
                <th>สถานะชำระ</th>
                <th>สถานะจัดส่ง</th>
              </tr>
            </thead>
            <tbody>
              ${data.orders.slice(-6).reverse().map((order, index) => `
                <tr>
                  <td>${index + 1}</td>
                  <td>${order.customerName || order.customerId}</td>
                  <td>${order.totalAmount.toLocaleString()} ฿</td>
                  <td><span class="status ${order.paymentStatus === 'paid' ? 'paid' : 'pending'}">${order.paymentStatus}</span></td>
                  <td>${order.deliveryStatus}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      loadDashboard().catch((err) => {
        document.getElementById('ordersTable').innerHTML = `<p class="loading">โหลดข้อมูลไม่สำเร็จ: ${err.message}</p>`;
      });

      setInterval(() => {
        loadDashboard().catch(() => undefined);
      }, 5000);

      window.addEventListener('focus', () => {
        loadDashboard().catch(() => undefined);
      });
    </script>
  </body>
</html>
